# Deploy EvoClawSite to GitHub Pages.
#
# Source: this repository's root (index.html, zh.html, architecture-*.html,
#         design-*.html, architecture.html, design.html, 404.html, sitemap.xml,
#         robots.txt, .nojekyll, version, README.md).
# Trigger: every push to main, or manual workflow_dispatch.
# Pages source: GitHub Actions.
#
# One-time setup in the repo:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
#
# After this workflow succeeds the site is served at
#   https://develolin.github.io/EvoClawSite/

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload repo root as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the whole repository working tree. The site lives at the
          # repo root (no nested site/ subfolder in the EvoClawSite repo).
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
