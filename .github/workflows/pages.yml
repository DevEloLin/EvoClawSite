# Deploy the static EvoClawSite (site/) to GitHub Pages.
#
# Source: site/ directory (index.html, zh.html, sitemap.xml, robots.txt, 404.html, .nojekyll)
# Trigger: push to main, or manual workflow_dispatch
# Pages source: GitHub Actions
#
# Set up once in the repo:
#   Settings -> Pages -> Source: GitHub Actions
#
# After this workflow runs successfully the site is served at
#   https://<owner>.github.io/<repo>/

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site/ as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
